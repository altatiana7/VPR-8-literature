<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ВПР · Литература · 8 класс</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/unbounded@5.0.0/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/plus-jakarta-sans@5.0.0/index.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --yellow:#FFD93D;--pink:#FF6B9D;--blue:#4D96FF;--purple:#A66CFF;
    --orange:#FF8C42;--mint:#6BCB77;--cream:#FFF8E7;--ink:#1A1A2E;
    --soft:#F5F0FF;
    --shadow:0 8px 0 rgba(26,26,46,.15);
    --shadow-lg:0 12px 0 rgba(26,26,46,.18);
  }
  html,body{height:100%}
  body{
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    background:var(--cream);color:var(--ink);
    min-height:100vh;line-height:1.5;font-size:18px;overflow-x:hidden;
  }
  h1,h2,h3,h4{font-family:'Unbounded',sans-serif;font-weight:700;line-height:1.1}
  .container{max-width:1200px;margin:0 auto;padding:24px}

  .hero{position:relative;padding:60px 20px 50px;text-align:center;overflow:hidden}
  .hero::before,.hero::after{content:'';position:absolute;border-radius:50%;z-index:0}
  .hero::before{width:300px;height:300px;background:var(--yellow);top:-80px;left:-80px}
  .hero::after{width:220px;height:220px;background:var(--pink);bottom:-60px;right:-40px}
  .hero > *{position:relative;z-index:1}
  .hero-badge{
    display:inline-block;background:var(--ink);color:var(--yellow);
    padding:10px 22px;border-radius:30px;font-weight:700;font-size:1rem;
    margin-bottom:24px;letter-spacing:1px;
  }
  .hero h1{font-size:clamp(2.5rem,7vw,5rem);margin-bottom:20px;letter-spacing:-1px}
  .hero h1 .word1{color:var(--ink)}
  .hero h1 .word2{color:var(--pink);display:inline-block;transform:rotate(-2deg)}
  .hero h1 .word3{color:var(--blue);display:inline-block;transform:rotate(2deg)}
  .hero p{max-width:700px;margin:0 auto 30px;font-size:1.3rem;font-weight:500}
  .stats{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:30px}
  .stat{
    background:#fff;padding:18px 28px;border-radius:20px;
    box-shadow:var(--shadow);border:3px solid var(--ink);transition:transform .2s;
  }
  .stat:hover{transform:translateY(-4px)}
  .stat:nth-child(1){background:var(--yellow)}
  .stat:nth-child(2){background:var(--pink);color:#fff}
  .stat:nth-child(3){background:var(--blue);color:#fff}
  .stat:nth-child(4){background:var(--mint);color:#fff}
  .stat b{display:block;font-size:2.2rem;font-family:'Unbounded',sans-serif}
  .stat span{font-size:.95rem;font-weight:600}

  .tabs{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:30px 0}
  .tab{
    background:#fff;border:3px solid var(--ink);
    padding:14px 22px;border-radius:50px;cursor:pointer;
    color:var(--ink);font-size:1rem;font-weight:700;
    transition:all .2s;display:flex;align-items:center;gap:10px;
    box-shadow:4px 4px 0 var(--ink);
    font-family:'Plus Jakarta Sans',sans-serif;
  }
  .tab:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
  .tab.active{background:var(--purple);color:#fff;box-shadow:4px 4px 0 var(--ink)}
  .tab .num{
    background:var(--ink);color:var(--yellow);
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Unbounded',sans-serif;font-size:1rem;
  }
  .tab.active .num{background:#fff;color:var(--purple)}
  .tab.vpr{background:var(--orange);color:#fff;border-color:var(--ink)}
  .tab.vpr.active{background:var(--pink)}

  .section{display:none;animation:pop .4s ease}
  .section.active{display:block}
  @keyframes pop{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}

  .topic-header{
    background:#fff;border:4px solid var(--ink);
    padding:40px;border-radius:32px;margin-bottom:30px;
    box-shadow:var(--shadow-lg);
    display:grid;grid-template-columns:1fr 220px;gap:30px;align-items:center;
    position:relative;overflow:hidden;
  }
  .topic-header::before{
    content:'';position:absolute;width:120px;height:120px;
    background:var(--yellow);border-radius:50%;top:-40px;right:250px;opacity:.5;
  }
  .topic-header h2{font-size:clamp(1.8rem,4vw,3rem);margin-bottom:14px;position:relative}
  .topic-header p{font-size:1.2rem;font-weight:500;max-width:600px;position:relative}
  .topic-ill svg{width:100%;height:auto;max-width:220px}

  .theory{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:30px}
  .card{
    background:#fff;border:4px solid var(--ink);
    padding:26px;border-radius:24px;box-shadow:var(--shadow);
    transition:transform .2s;position:relative;
  }
  .card:hover{transform:translate(-3px,-3px);box-shadow:7px 7px 0 var(--ink)}
  .card::before{
    content:'';position:absolute;top:16px;right:16px;
    width:24px;height:24px;border-radius:50%;background:var(--pink);
  }
  .card:nth-child(2n)::before{background:var(--blue)}
  .card:nth-child(3n)::before{background:var(--mint)}
  .card:nth-child(4n)::before{background:var(--orange)}
  .card h3{color:var(--ink);margin-bottom:12px;font-size:1.5rem}
  .card .def{font-size:1.05rem;margin-bottom:14px;font-weight:500}
  .card .ex{
    background:var(--soft);padding:14px 18px;border-radius:14px;
    font-style:italic;font-size:1rem;border-left:6px solid var(--purple);
  }
  .card .ex b{color:var(--purple);font-style:normal;font-weight:700}

  .rule{
    background:var(--yellow);border:4px solid var(--ink);
    padding:28px;border-radius:24px;margin-bottom:30px;box-shadow:var(--shadow);
  }
  .rule h4{color:var(--ink);margin-bottom:16px;font-size:1.4rem;display:flex;align-items:center;gap:10px}
  .rule ul{list-style:none;padding-left:0}
  .rule li{padding:10px 0 10px 44px;position:relative;font-size:1.1rem;font-weight:600}
  .rule li::before{content:'→';position:absolute;left:0;top:10px;color:var(--pink);font-weight:900;font-size:1.4rem}

  .task{
    background:#fff;border:4px solid var(--ink);
    padding:28px;border-radius:24px;margin-bottom:22px;box-shadow:var(--shadow);
  }
  .task-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
  .task-head h3{color:var(--ink);font-size:1.4rem}
  .task-badge{
    background:var(--blue);color:#fff;padding:6px 16px;border-radius:20px;
    font-size:.9rem;font-weight:700;border:3px solid var(--ink);
  }
  .task-text{margin-bottom:18px;font-size:1.15rem;font-weight:500}
  .task-text .quote{
    background:var(--soft);padding:18px 22px;border-radius:16px;
    border-left:6px solid var(--pink);margin:14px 0;
    font-style:italic;font-size:1.15rem;font-weight:600;
    white-space:pre-line;
  }
  .task-text .source{
    display:inline-block;background:var(--ink);color:var(--yellow);
    padding:4px 12px;border-radius:12px;font-size:.85rem;font-weight:700;
    margin-bottom:10px;
  }
  .options{display:grid;gap:12px;margin-bottom:18px}
  .opt{
    background:#fff;border:3px solid var(--ink);
    padding:16px 20px;border-radius:16px;cursor:pointer;
    transition:all .15s;display:flex;align-items:center;gap:16px;
    font-size:1.1rem;font-weight:600;box-shadow:3px 3px 0 var(--ink);
  }
  .opt:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink);background:var(--soft)}
  .opt.selected{background:var(--yellow);border-color:var(--ink)}
  .opt.correct{background:var(--mint);color:#fff;border-color:var(--ink)}
  .opt.wrong{background:var(--pink);color:#fff;border-color:var(--ink)}
  .opt .dot{
    width:26px;height:26px;border-radius:50%;
    border:3px solid var(--ink);flex-shrink:0;background:#fff;position:relative;
  }
  .opt.selected .dot{background:var(--ink)}
  .opt.correct .dot{background:#fff;border-color:#fff}
  .opt.correct .dot::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mint);font-weight:900;font-size:1.1rem}
  .opt.wrong .dot{background:#fff;border-color:#fff}
  .opt.wrong .dot::after{content:'×';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--pink);font-weight:900;font-size:1.3rem}

  /* INPUT для ввода слова */
  .input-wrap{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
  .answer-input{
    flex:1;min-width:220px;
    background:#fff;border:3px solid var(--ink);
    padding:14px 20px;border-radius:16px;
    font-size:1.15rem;font-weight:600;font-family:inherit;
    box-shadow:3px 3px 0 var(--ink);
    outline:none;transition:all .15s;
  }
  .answer-input:focus{border-color:var(--purple);box-shadow:3px 3px 0 var(--purple)}
  .answer-input.correct{background:var(--mint);color:#fff;border-color:var(--ink)}
  .answer-input.wrong{background:var(--pink);color:#fff;border-color:var(--ink)}

  /* MATCHING — таблица соответствий */
  .match-table{
    display:grid;gap:12px;margin-bottom:18px;
  }
  .match-row{
    display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
    background:var(--soft);padding:14px 18px;border-radius:16px;
    border:3px solid var(--ink);
  }
  .match-row .letter{
    background:var(--ink);color:var(--yellow);
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Unbounded',sans-serif;font-weight:900;font-size:1.1rem;
    flex-shrink:0;
  }
  .match-row .text{font-size:1rem;font-weight:500;flex:1}
  .match-row select{
    padding:10px 16px;border:3px solid var(--ink);border-radius:12px;
    background:#fff;font-size:1rem;font-weight:700;font-family:inherit;
    cursor:pointer;min-width:160px;
  }
  .match-row.correct{background:var(--mint);color:#fff;border-color:var(--ink)}
  .match-row.correct select{background:var(--mint);color:#fff;border-color:#fff}
  .match-row.wrong{background:var(--pink);color:#fff;border-color:var(--ink)}
  .match-row.wrong select{background:var(--pink);color:#fff;border-color:#fff}

  .btns{display:flex;gap:12px;flex-wrap:wrap}
  .btn{
    background:var(--ink);color:var(--yellow);
    border:3px solid var(--ink);
    padding:14px 28px;border-radius:50px;
    font-weight:800;cursor:pointer;font-size:1.05rem;
    transition:all .15s;box-shadow:4px 4px 0 var(--pink);
    font-family:'Plus Jakarta Sans',sans-serif;
  }
  .btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--pink)}
  .btn.ghost{background:#fff;color:var(--ink);box-shadow:4px 4px 0 var(--blue)}
  .btn.ghost:hover{box-shadow:6px 6px 0 var(--blue)}
  .btn.sample{background:var(--purple);color:#fff;box-shadow:4px 4px 0 var(--ink)}
  .btn.sample:hover{box-shadow:6px 6px 0 var(--ink)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

  .feedback{
    margin-top:18px;padding:18px 22px;border-radius:16px;
    display:none;animation:pop .3s;font-size:1.05rem;font-weight:500;
    border:3px solid var(--ink);
  }
  .feedback.show{display:block}
  .feedback.ok{background:var(--mint);color:#fff}
  .feedback.err{background:var(--pink);color:#fff}
  .feedback b{display:block;margin-bottom:6px;font-family:'Unbounded',sans-serif;font-size:1.2rem}

  .sample-box{
    margin-top:14px;padding:18px 22px;border-radius:16px;
    background:var(--soft);border:3px dashed var(--purple);
    display:none;animation:pop .3s;
  }
  .sample-box.show{display:block}
  .sample-box h4{color:var(--purple);margin-bottom:10px;font-size:1.1rem}
  .sample-box p{font-size:1rem;line-height:1.6}

  textarea.free-answer{
    width:100%;min-height:140px;
    background:var(--soft);border:3px solid var(--ink);
    padding:14px 18px;border-radius:16px;
    font-size:1rem;font-family:inherit;font-weight:500;
    resize:vertical;margin-bottom:14px;
  }
  textarea.free-answer:focus{outline:none;border-color:var(--purple)}

  .progress-wrap{
    position:sticky;top:10px;z-index:50;
    background:#fff;border:4px solid var(--ink);
    padding:14px 22px;border-radius:20px;box-shadow:var(--shadow);
    margin-bottom:24px;display:flex;align-items:center;gap:16px;
  }
  .progress-bar{flex:1;height:18px;background:var(--soft);border-radius:20px;overflow:hidden;border:2px solid var(--ink)}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--yellow),var(--pink));transition:width .5s;width:0}
  .progress-text{font-size:1rem;font-weight:800;white-space:nowrap;color:var(--ink)}

  footer{text-align:center;padding:50px 20px 30px;font-weight:700;font-size:1.1rem;color:var(--ink)}
  footer .heart{color:var(--pink);display:inline-block;animation:beat 1.2s infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}

  @media(max-width:700px){
    .topic-header{grid-template-columns:1fr;text-align:center;padding:28px}
    .topic-ill{order:-1;margin:0 auto;max-width:180px}
    .hero h1{font-size:2.5rem}
    .task{padding:20px}
    .card{padding:20px}
    .match-row{grid-template-columns:1fr;gap:10px}
  }
</style>
</head>

<div class="container">

  <section class="hero">
    <span class="hero-badge">★ 8 КЛАСС · ВПР ★</span>

      <span class="word1">ЛИТЕРАТУРА</span><br>

    <p>Интерактивные разборы заданий Всероссийской проверочной работы: теория с примерами, реальные варианты ВПР 2026 и задания с автопроверкой.</p>

  <main id="sections"></main>

</div>

const tabsEl = document.getElementById('tabs');
const sectionsEl = document.getElementById('sections');
const progressText = document.getElementById('progressText');
const progressFill = document.getElementById('progressFill');

const allTopics = [...TOPICS, ...VPR_VARIANTS];

// tabs
allTopics.forEach((t,i)=>{
  const btn = document.createElement('button');
  const isVpr = t.id.startsWith('vpr');
  btn.className = 'tab' + (i===0?' active':'') + (isVpr?' vpr':'');
  btn.innerHTML = `<span class="num">${i+1}</span>${t.title}`;
  btn.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('sec-'+t.id).classList.add('active');
    window.scrollTo({top:tabsEl.offsetTop-20,behavior:'smooth'});
  };
  tabsEl.appendChild(btn);
});

// sections
allTopics.forEach((t,i)=>{
  const sec = document.createElement('section');

  sec.innerHTML = `

// Нормализация для сравнения
function norm(s){return s.trim().toLowerCase().replace(/ё/g,'е')}

document.querySelectorAll('.task').forEach(taskEl=>{
  const type = taskEl.dataset.type;
  const checkBtn = taskEl.querySelector('.check-btn');
  const resetBtn = taskEl.querySelector('.reset-btn');
  const fb = taskEl.querySelector('.feedback');
  const tid = taskEl.dataset.task;
  const [topicId, ti] = tid.split('-');
  const topic = allTopics.find(x=>x.id===topicId);
  const task = topic.tasks[+ti];
  let answered = false;

  function markAnswered(isOk){
    answered = true;
    if(checkBtn) checkBtn.disabled = true;
    updateProgress();
  }

  if(type === 'choice'){
    const opts = taskEl.querySelectorAll('.opt');
    let selected = null;
    opts.forEach(o=>{
      o.onclick = ()=>{
        if(answered) return;
        opts.forEach(x=>x.classList.remove('selected'));
        o.classList.add('selected');
        selected = +o.dataset.idx;
      };
    });
    checkBtn.onclick = ()=>{
      if(selected===null){
        fb.className='feedback show err';
        fb.querySelector('b').textContent='⚠️ ВЫБЕРИ ВАРИАНТ';
        fb.querySelector('span').textContent='Нажми на один из ответов.';
        return;
      }
      if(answered) return;
      opts.forEach((o,i)=>{
        o.style.pointerEvents='none';
        if(i===task.correct) o.classList.add('correct');
        else if(i===selected) o.classList.add('wrong');
      });
      const isOk = selected===task.correct;
      fb.className = 'feedback show ' + (isOk?'ok':'err');
      fb.querySelector('b').textContent = isOk?'✅ ВЕРНО!':'❌ НЕВЕРНО';
      fb.querySelector('span').innerHTML = task.expl;
      markAnswered(isOk);
    };
    resetBtn.onclick = ()=>{
      if(!answered && selected===null) return;
      answered = false; selected = null;
      opts.forEach(o=>{
        o.classList.remove('selected','correct','wrong');
        o.style.pointerEvents='';
      });
      fb.classList.remove('show');
      checkBtn.disabled = false;
      updateProgress();
    };
  }
  else if(type === 'input'){
    const inp = taskEl.querySelector('.answer-input');
    checkBtn.onclick = ()=>{
      const val = inp.value.trim();
      if(!val){
        fb.className='feedback show err';
        fb.querySelector('b').textContent='⚠️ ВВЕДИ ОТВЕТ';
        fb.querySelector('span').textContent='Напиши слово в поле ввода.';
        return;
      }
      if(answered) return;
      const isOk = task.correct.some(c => norm(c) === norm(val));
      inp.classList.add(isOk?'correct':'wrong');
      inp.disabled = true;
      fb.className = 'feedback show ' + (isOk?'ok':'err');
      fb.querySelector('b').textContent = isOk?'✅ ВЕРНО!':'❌ НЕВЕРНО';
      fb.querySelector('span').innerHTML = task.expl + (!isOk ? `<br><br>Правильный ответ: <b>${task.correct[0]}</b>` : '');
      markAnswered(isOk);
    };
    resetBtn.onclick = ()=>{
      if(!answered && !inp.value) return;
      answered = false;
      inp.value = '';
      inp.disabled = false;
      inp.classList.remove('correct','wrong');
      fb.classList.remove('show');
      checkBtn.disabled = false;
      updateProgress();
    };
  }
  else if(type === 'match'){
    const selects = taskEl.querySelectorAll('.match-table select');
    const rows = taskEl.querySelectorAll('.match-row');
    checkBtn.onclick = ()=>{
      const answers = {};
      let allFilled = true;
      selects.forEach(s=>{
        if(s.value === '') allFilled = false;
        else answers[s.dataset.letter] = +s.value;
      });
      if(!allFilled){
        fb.className='feedback show err';
        fb.querySelector('b').textContent='⚠️ ЗАПОЛНИ ВСЕ СТРОКИ';
        fb.querySelector('span').textContent='Выбери соответствие для каждой буквы.';
        return;
      }
      if(answered) return;
      let allCorrect = true;
      rows.forEach(r=>{
        const letter = r.dataset.letter;
        const sel = r.querySelector('select');
        const userVal = +sel.value;
        const correctVal = task.correct[letter];
        r.classList.remove('correct','wrong');
        if(userVal === correctVal){
          r.classList.add('correct');
        } else {
          r.classList.add('wrong');
          allCorrect = false;
        }
        sel.disabled = true;
      });
      fb.className = 'feedback show ' + (allCorrect?'ok':'err');
      fb.querySelector('b').textContent = allCorrect?'✅ ВСЁ ВЕРНО!':'❌ ЕСТЬ ОШИБКИ';
      fb.querySelector('span').innerHTML = task.expl;
      markAnswered(allCorrect);
    };
    resetBtn.onclick = ()=>{
      if(!answered && [...selects].every(s=>s.value==='')) return;
      answered = false;
      selects.forEach(s=>{s.value='';s.disabled=false});
      rows.forEach(r=>r.classList.remove('correct','wrong'));
      fb.classList.remove('show');
      checkBtn.disabled = false;
      updateProgress();
    };
  }
  else if(type === 'free'){
    const sampleBtn = taskEl.querySelector('.show-sample-btn');
    const sampleBox = taskEl.querySelector('.sample-box');
    sampleBtn.onclick = ()=>{
      sampleBox.classList.toggle('show');
      sampleBtn.textContent = sampleBox.classList.contains('show')?'СКРЫТЬ ОБРАЗЕЦ':'ПОКАЗАТЬ ОБРАЗЕЦ';
    };
  }
});

function updateProgress(){
  let total = 0, correct = 0;
  document.querySelectorAll('.task').forEach(t=>{
    const type = t.dataset.type;
    if(type === 'free') return; // не считаем в прогресс
    total++;
    const btn = t.querySelector('.check-btn');
    if(btn && btn.disabled){
      // проверяем по наличию правильных ответов без ошибок
      if(type === 'choice'){
        if(t.querySelector('.opt.correct') && !t.querySelector('.opt.wrong')) correct++;
      } else if(type === 'input'){
        const inp = t.querySelector('.answer-input');
        if(inp.classList.contains('correct')) correct++;
      } else if(type === 'match'){
        const rows = t.querySelectorAll('.match-row');
        if([...rows].every(r=>r.classList.contains('correct'))) correct++;
      }
    }
  });
  progressText.textContent = `РЕШЕНО ВЕРНО: ${correct} / ${total}`;
  progressFill.style.width = total ? (correct/total*100)+'%' : '0%';
}
updateProgress();
</script>
</body>
</html>
